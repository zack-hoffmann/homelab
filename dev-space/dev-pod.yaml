apiVersion: v1
kind: Pod
metadata:
  name: dev-pod
  namespace: dev-space
  labels:
    app: vscode-dev
spec:
  containers:
  - name: dev
    image: mcr.microsoft.com/devcontainers/java:21
    command: ["sleep", "infinity"]
    resources:
      limits:
        cpu: "4"
        memory: "8Gi"
      requests:
        cpu: "1"
        memory: "2Gi"