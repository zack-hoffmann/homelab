console:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.middlewares: redpanda-console-basic-auth@kubernetescrd
    className: traefik
    enabled: true
    hosts:
    - host: redpanda.gamedev.the-hoffmanns.org
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - redpanda.gamedev.the-hoffmanns.org
      secretName: redpanda-console-tls-secret